name: mindmirror
description: "MindMirror - personalized behavioral analytics. See the patterns behind your days."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  cloud_functions: ^6.0.1
  firebase_messaging: ^16.0.1

  # Notifications
  flutter_local_notifications: ^19.4.1
  timezone: ^0.10.1

  # Charts & formatting
  fl_chart: ^1.1.0
  intl: ^0.20.2
  firebase_ai: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
